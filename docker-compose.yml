name: connexto-aihub

services:
  gateway:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
      args:
        NODE_VERSION: "24.22.1"
        PNPM_VERSION: "12.16.1"
    image: agent-runtime-gateway:local
    ports:
      - 9090:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: apps/proxy/.env
        required: true
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_FORMAT: json
      LOG_LEVEL: info
      # Host .env often points at WSL Chrome + headed auth; invalid inside the container.
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CHROMIUM_NO_SANDBOX: "true"
      CURSOR_USAGE_AUTH_HEADLESS: "true"
      HOME: /var/lib/connexto-proxy/gateway-home
      CURSOR_USAGE_AUTH_USER_DATA_DIR: /var/lib/connexto-proxy/cursor-usage-auth
      CURSOR_USAGE_INTERACTION_URL_BASE: http://127.0.0.1:9090
      GATEWAY_JSON_BODY_LIMIT_BYTES: ${GATEWAY_JSON_BODY_LIMIT_BYTES:-33554432}
      CURSOR_DEFAULT_WORKING_DIRECTORY: /workspace
      SESSION_STORAGE_DRIVER: ${SESSION_STORAGE_DRIVER:-filesystem}
      SESSION_STORAGE_PATH: ${DOCKER_SESSION_STORAGE_PATH:-/var/lib/connexto-proxy/sessions}
      AGY_PATH: /app/.gemini/bin/agy
      ANTIGRAVITY_STORAGE_PATH: ${ANTIGRAVITY_STORAGE_PATH:-/app}
      PATH: /app/.gemini/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      BROWSER_BRIDGE_URL: ${BROWSER_BRIDGE_URL:-http://host.docker.internal:4318}
      BROWSER_BRIDGE_TOKEN: ${BROWSER_BRIDGE_TOKEN:-stage3-secure-token-xyz}
    volumes:
      - ${CURSOR_WORKSPACE_HOST_PATH:-.}:/workspace:rw
      - ${HOST_HOME:-${HOME}}:${HOST_HOME:-${HOME}}:rw
      - proxy-sessions:/var/lib/connexto-proxy/sessions:rw
      - ${HOST_GEMINI_DIR:-${HOME}/.gemini}:/app/.gemini:rw
      - ${HOST_ANTIGRAVITY_CONFIG_DIR:-${HOME}/.config/antigravity}:/app/.config/antigravity:rw
    user: ${CURSOR_CONTAINER_USER:-1000:1000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: aihub-backend:local
    ports:
      - "${AIHUB_SERVER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: true
    environment:
      AIHUB_SERVER_HOST: 0.0.0.0
      AIHUB_SERVER_PORT: 8080
      AIHUB_DATA_DIR: /var/lib/aihub
      AIHUB_SERVE_EMBEDDED_UI: "false"
      AIHUB_LOG_FORMAT: ${AIHUB_LOG_FORMAT:-json}
      AIHUB_GATEWAY_ALLOWED_HOSTS: ${AIHUB_GATEWAY_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,aihub-backend}
      AIHUB_PROVIDER_CONNEXTO_PROXY_BASE_URL: ${AIHUB_DOCKER_PROXY_BASE_URL:-http://gateway:9090/v1}
      AIHUB_DOCKER_REWRITE_LOOPBACK_PROXY: ${AIHUB_DOCKER_REWRITE_LOOPBACK_PROXY:-true}
      AIHUB_PROVIDER_ALLOWED_HOSTS: ${AIHUB_PROVIDER_ALLOWED_HOSTS:-opencode.ai,openrouter.ai,127.0.0.1,localhost,gateway,connexto-aihub-gateway-1,host.docker.internal}
      # Non-loopback listeners disable loopback_trust; operator auth requires a passphrase + 32+ byte secret.
      AIHUB_OPERATOR_PASSPHRASE: ${AIHUB_OPERATOR_PASSPHRASE:-aihub-local-operator-passphrase}
      AIHUB_UI_SESSION_SECRET: ${AIHUB_UI_SESSION_SECRET:-aihub-local-docker-session-secret-32bytes}
      AIHUB_UI_SECURE_COOKIES: ${AIHUB_UI_SECURE_COOKIES:-false}
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ${AIHUB_HOST_DATA_DIR:-${HOME}/.local/share/ai-hub}:/var/lib/aihub:rw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NODE_VERSION: "24.22.1"
        PNPM_VERSION: "12.16.1"
    image: aihub-frontend:local
    ports:
      - "${AIHUB_FRONTEND_PORT:-5173}:80"
    environment:
      AIHUB_BACKEND_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  proxy-sessions:
